<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Donna</title>
<link rel="icon" type="image/png" href="/static/donna_icon.png">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
:root {
--bg: #000;
--bg2: #1c1c1e;
--bg3: #2c2c2e;
--label: #fff;
--label2: rgba(235,235,245,0.6);
--label3: rgba(235,235,245,0.3);
--sep: rgba(255,255,255,0.08);
--blue: #0a84ff;
--green: #30d158;
--red: #ff453a;
--gray: #8e8e93;
--safe-top: env(safe-area-inset-top, 0px);
--safe-bottom: env(safe-area-inset-bottom, 0px);
}
body {
background: var(--bg);
color: var(--label);
font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', system-ui, sans-serif;
height: 100dvh;
overflow: hidden;
}
#main-view, #detail-view {
height: 100dvh;
display: flex;
flex-direction: column;
overflow: hidden;
}
#detail-view { display: none; }
#header {
padding-top: calc(var(--safe-top) + 20px);
padding-left: 20px;
padding-right: 20px;
padding-bottom: 10px;
flex-shrink: 0;
}
#greeting {
font-size: 30px;
font-weight: 700;
letter-spacing: -0.5px;
}
#datestamp {
font-size: 13px;
color: var(--gray);
margin-top: 2px;
}
.section-label {
font-size: 12px;
font-weight: 600;
letter-spacing: 0.04em;
color: var(--gray);
text-transform: uppercase;
padding: 12px 20px 6px;
flex-shrink: 0;
}
#markets-strip {
display: flex;
overflow-x: auto;
scroll-snap-type: x mandatory;
-webkit-overflow-scrolling: touch;
scrollbar-width: none;
padding: 4px 20px 12px;
gap: 8px;
flex-shrink: 0;
border-bottom: 0.5px solid var(--sep);
}
#markets-strip::-webkit-scrollbar { display: none; }
.market-item {
scroll-snap-align: start;
flex-shrink: 0;
border-radius: 12px;
padding: 10px 14px;
min-width: 106px;
display: flex;
flex-direction: column;
gap: 2px;
}
.market-item.up { background: rgba(48,209,88,0.15); }
.market-item.down { background: rgba(255,69,58,0.15); }
.market-item.flat { background: var(--bg2); }
.market-name { font-size: 11px; font-weight: 500; color: var(--gray); }
.market-pct { font-size: 17px; font-weight: 700; letter-spacing: -0.3px; }
.up .market-pct { color: var(--green); }
.down .market-pct { color: var(--red); }
.flat .market-pct { color: var(--gray); }
#news-list {
flex: 1;
overflow-y: auto;
scrollbar-width: none;
padding-bottom: calc(var(--safe-bottom) + 20px);
}
#news-list::-webkit-scrollbar { display: none; }
.news-item {
padding: 13px 20px;
display: flex;
gap: 12px;
align-items: flex-start;
cursor: pointer;
border-bottom: 0.5px solid var(--sep);
}
.news-item:active { background: rgba(255,255,255,0.05); }
.news-num {
font-size: 13px;
color: var(--label3);
padding-top: 1px;
min-width: 20px;
font-variant-numeric: tabular-nums;
}
.news-body { flex: 1; }
.news-source {
font-size: 10px;
font-weight: 700;
color: var(--label3);
letter-spacing: 0.06em;
text-transform: uppercase;
margin-bottom: 3px;
}
.news-title {
font-size: 15px;
font-weight: 400;
line-height: 1.38;
color: var(--label);
letter-spacing: -0.1px;
}
.news-arrow {
color: var(--label3);
font-size: 20px;
font-weight: 300;
align-self: center;
}
#detail-navbar {
padding-top: calc(var(--safe-top) + 8px);
padding-left: 16px;
padding-right: 16px;
padding-bottom: 8px;
flex-shrink: 0;
backdrop-filter: blur(20px);
-webkit-backdrop-filter: blur(20px);
background: rgba(0,0,0,0.85);
border-bottom: 0.5px solid var(--sep);
}
#back-btn {
background: none;
border: none;
color: var(--blue);
font-family: inherit;
font-size: 17px;
cursor: pointer;
padding: 4px 0;
}
#detail-scroll {
flex: 1;
overflow-y: auto;
padding: 24px 20px calc(var(--safe-bottom) + 40px);
scrollbar-width: none;
}
#detail-scroll::-webkit-scrollbar { display: none; }
#detail-source {
font-size: 11px;
font-weight: 700;
color: var(--gray);
letter-spacing: 0.06em;
text-transform: uppercase;
margin-bottom: 8px;
}
#detail-headline {
font-size: 24px;
font-weight: 700;
line-height: 1.25;
color: var(--label);
letter-spacing: -0.5px;
margin-bottom: 28px;
}
.article-section { margin-bottom: 24px; }
.article-section-label {
font-size: 15px;
font-weight: 700;
color: var(--label);
letter-spacing: -0.1px;
margin-bottom: 10px;
padding-bottom: 8px;
border-bottom: 0.5px solid var(--sep);
}
.article-section-body {
font-size: 16px;
line-height: 1.6;
color: var(--label2);
letter-spacing: -0.1px;
}
.article-section-body p { margin-bottom: 10px; }
#loading-dots { display: flex; gap: 6px; padding: 40px 0; }
.dot {
width: 6px; height: 6px; border-radius: 50%;
background: var(--bg3);
animation: pulse 1.2s ease-in-out infinite;
}
.dot:nth-child(2) { animation-delay: 0.15s; }
.dot:nth-child(3) { animation-delay: 0.30s; }
@keyframes pulse { 0%,100%{opacity:0.2} 50%{opacity:1} }
.error-msg {
padding: 12px 16px;
font-size: 13px;
color: var(--red);
background: rgba(255,69,58,0.1);
border-radius: 8px;
margin: 12px 20px;
}
</style>
</head>
<body>
<div id="main-view">
<div id="header">
<div id="greeting"></div>
<div id="datestamp"></div>
</div>
<div id="loading-screen" style="flex:1;display:flex;align-items:center;justify-content:center;">
<div style="display:flex;gap:6px;"><div class="dot"></div><div class="dot"></div><div class="dot"></div></div>
</div>
<div id="content-ready" style="display:none;flex-direction:column;flex:1;overflow:hidden;">
<div class="section-label">Bolsas</div>
<div id="markets-strip"></div>
<div class="section-label">Titulares</div>
<div id="news-list"></div>
</div>
</div>
<div id="detail-view">
<div id="detail-navbar">
<button id="back-btn" onclick="goBack()">‹ Inicio</button>
</div>
<div id="detail-scroll">
<div id="detail-source"></div>
<div id="detail-headline"></div>
<div id="detail-body"></div>
</div>
</div>
<script>
const GROQ_URL = "https://api.groq.com/openai/v1/chat/completions";
let GROQ_KEY = "";
 
async function groq(prompt, maxTokens, temperature) {
  const r = await fetch(GROQ_URL, {
    method: "POST",
    headers: {
      "Authorization": "Bearer " + GROQ_KEY,
      "Content-Type": "application/json"
    },
    body: JSON.stringify({
      model: "llama-3.1-8b-instant",
      messages: [{ role: "user", content: prompt }],
      max_tokens: maxTokens || 1000,
      temperature: temperature || 0.5
    })
  });
  if (!r.ok) throw new Error("Groq " + r.status);
  const data = await r.json();
  return data.choices[0].message.content;
}
 
const h = new Date().getHours();
document.getElementById("greeting").textContent =
  (h < 13 ? "Buenos días" : h < 21 ? "Buenas tardes" : "Buenas noches") + ", Gonzalo";
document.getElementById("datestamp").textContent =
  new Date().toLocaleDateString("es-ES", { weekday:"long", day:"numeric", month:"long" });
 
async function init() {
  // Cargar config (Groq key) antes de cualquier llamada a IA
  try {
    const cfg = await fetch("/api/config").then(r => r.json());
    GROQ_KEY = cfg.groq_key || "";
  } catch(e) {
    console.warn("No se pudo cargar config:", e);
  }
 
  // Mostrar contenido solo cuando todo esté listo
  function showContent() {
    document.getElementById("loading-screen").style.display = "none";
    document.getElementById("content-ready").style.display = "flex";
  }
 
  let marketsReady = false;
  let newsReady = false;
  let articlesData = [];
 
  function checkReady() {
    if (marketsReady && newsReady) showContent();
  }
 
  // Mercados
  fetch("/api/markets").then(r => r.json()).then(data => {
    const strip = document.getElementById("markets-strip");
    const items = data.filter(m => m.pct !== null);
    if (!items.length) {
      strip.innerHTML = '<div class="error-msg">Sin datos de mercado</div>';
    } else {
      strip.innerHTML = items.map(m => {
        const cls = m.pct > 0 ? "up" : m.pct < 0 ? "down" : "flat";
        const sign = m.pct > 0 ? "+" : "";
        return `<div class="market-item ${cls}">
          <span class="market-name">${m.name}</span>
          <span class="market-pct">${sign}${m.pct.toFixed(2)}%</span>
        </div>`;
      }).join("");
    }
    marketsReady = true;
    checkReady();
  }).catch(() => {
    document.getElementById("markets-strip").innerHTML = '<div class="error-msg">Error mercados</div>';
    marketsReady = true;
    checkReady();
  });
 
  // Noticias: esperar a Groq antes de mostrar nada
  fetch("/api/news").then(r => r.json()).then(async data => {
    articlesData = data;
    if (GROQ_KEY) {
      try {
        const titles = data.map((a, i) => `${i+1}. [${a.source}] ${a.title}`).join("\n");
        const raw = await groq(
          `Transforma estos titulares en frases informativas en español, máximo 15 palabras cada una. ` +
          `Incluye siempre: quién (empresa, país, índice, persona), qué pasó, y cifras si las hay. ` +
          `Ejemplo: "El BCE sube tipos al 4,5% por inflación persistente en la eurozona". ` +
          `Traduce los que estén en inglés. Sin comentarios ni explicaciones.\n\n` +
          `${titles}\n\n` +
          `Responde ÚnicaMENTE con un array JSON válido, sin backticks ni texto extra:\n` +
          `[{"i":0,"t":"titular"},{"i":1,"t":"titular"},...]`,
          2500, 0.3
        );
        const cleaned = raw.replace(/```json|```/gi, "").trim();
        const s = cleaned.indexOf("["), e = cleaned.lastIndexOf("]");
        if (s !== -1 && e !== -1) {
          JSON.parse(cleaned.slice(s, e + 1)).forEach(item => {
            if (typeof item.i === "number" && item.t && data[item.i]) {
              data[item.i].title = item.t;
            }
          });
          articlesData = data;
        }
      } catch(e) {
        console.warn("Mejora titulares falló:", e);
      }
    }
    renderNewsList(articlesData);
    newsReady = true;
    checkReady();
  }).catch(() => {
    document.getElementById("news-list").innerHTML = '<div class="error-msg">Error cargando noticias</div>';
    newsReady = true;
    checkReady();
  });
 
  function renderNewsList(data) {
    document.getElementById("news-list").innerHTML = data.map((n, i) => `
      <div class="news-item" onclick="openArticle(${i})">
        <span class="news-num">${String(i+1).padStart(2,"0")}</span>
        <div class="news-body">
          <div class="news-source">${esc(n.source)}</div>
          <div class="news-title">${esc(n.title)}</div>
        </div>
        <span class="news-arrow">›</span>
      </div>
    `).join("");
  }
 
  window.openArticle = async function(idx) {
    const n = articlesData[idx];
    if (!n) return;
    document.getElementById("main-view").style.display = "none";
    document.getElementById("detail-view").style.display = "flex";
    document.getElementById("detail-source").textContent = n.source;
    document.getElementById("detail-headline").textContent = n.title;
    document.getElementById("detail-scroll").scrollTop = 0;
    document.getElementById("detail-body").innerHTML =
      `<div id="loading-dots"><div class="dot"></div><div class="dot"></div><div class="dot"></div></div>`;
 
    if (!GROQ_KEY) {
      document.getElementById("detail-body").innerHTML =
        `<div class="error-msg">API key no configurada en Render.</div>`;
      return;
    }
 
    const ctx = n.summary
      ? n.summary.replace(/<[^>]*>/g, "").slice(0, 400)
      : "Sin resumen disponible, analiza a partir del titular.";
    try {
      const content = await groq(
        `Eres un periodista económico español. Analiza esta noticia para Gonzalo, 18 años, ` +
        `que empieza Economía en CUNEF. Directo, sin relleno, con cifras cuando puedas.\n\n` +
        `Titular: ${n.title}\nFuente: ${n.source}\nContexto: ${ctx}\n\n` +
        `Escribe exactamente estos cuatro bloques. El nombre del bloque en su propia línea, solo en mayúsculas:\n\n` +
        `CONTEXTO\nQUÉ HA PASADO\nPOR QUÉ IMPORTA\nQUÉ VIGILAR\n\n` +
        `2-3 párrafos por bloque. En español. Sin asteriscos ni markdown.`,
        1400, 0.5
      );
      renderArticle(content);
    } catch(e) {
      document.getElementById("detail-body").innerHTML =
        `<div class="error-msg">Error al cargar el análisis. Revisa la API key.</div>`;
    }
  };
}
 
const SECTION_LABELS = {
  "CONTEXTO": "Contexto",
  "QUÉ HA PASADO": "¿Qué ha pasado?",
  "POR QUÉ IMPORTA": "¿Por qué importa?",
  "QUÉ VIGILAR": "¿Qué vigilar?"
};
 
function renderArticle(text) {
  const SECTIONS = ["CONTEXTO", "QUÉ HA PASADO", "POR QUÉ IMPORTA", "QUÉ VIGILAR"];
  const result = {};
  let current = null;
  text.split("\n").forEach(line => {
    const clean = line.trim().replace(/^#+\s*/, "").replace(/\*\*/g, "").trim();
    const matched = SECTIONS.find(s => clean.toUpperCase() === s);
    if (matched) { current = matched; result[current] = ""; }
    else if (current && clean) result[current] += (result[current] ? "\n" : "") + clean;
  });
  if (!Object.values(result).some(v => v.length > 0)) {
    document.getElementById("detail-body").innerHTML =
      `<div class="article-section"><div class="article-section-body">` +
      text.split("\n").filter(p => p.trim())
        .map(p => `<p>${esc(p.trim().replace(/\*\*/g,""))}</p>`).join("") +
      `</div></div>`;
    return;
  }
  document.getElementById("detail-body").innerHTML = SECTIONS.filter(s => result[s]).map(s => `
    <div class="article-section">
      <div class="article-section-label">${SECTION_LABELS[s]}</div>
      <div class="article-section-body">
        ${result[s].split("\n").filter(p=>p.trim()).map(p=>`<p>${esc(p.trim())}</p>`).join("")}
      </div>
    </div>
  `).join("");
}
 
function goBack() {
  document.getElementById("detail-view").style.display = "none";
  document.getElementById("main-view").style.display = "flex";
}
 
function esc(s) {
  return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
}
 
init();
</script>
</body>
</html>
